name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW-w64 g++)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Build EarnPerSecond.exe
        shell: msys2 {0}
        run: |
          windres -O coff src/app.rc -o app_res.o
          g++ -std=c++17 -O2 -municode -mwindows -static -static-libgcc -static-libstdc++ \
              src/main.cpp app_res.o -o EarnPerSecond.exe -luser32 -lgdi32 -lshell32

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EarnPerSecond-windows-x64
          path: EarnPerSecond.exe

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EarnPerSecond.exe
          generate_release_notes: true
